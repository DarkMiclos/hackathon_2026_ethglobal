<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NameFlow logo">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="flow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0a0e17"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- three flowing waves: sell (amber/purple), flow (blue), buy (green) -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M40 300 C 120 220, 180 380, 256 300 S 392 220, 472 300" stroke="url(#flow3)" stroke-width="16" opacity="0.55"/>
    <path d="M40 256 C 120 160, 180 352, 256 256 S 392 160, 472 256" stroke="url(#flow)" stroke-width="26"/>
    <path d="M40 212 C 120 132, 180 292, 256 212 S 392 132, 472 212" stroke="url(#flow2)" stroke-width="16" opacity="0.55"/>
  </g>

  <!-- traders and pools riding the wave -->
  <g filter="url(#softglow)">
    <circle cx="112" cy="220" r="15" fill="#3b82f6" stroke="#0a0e17" stroke-width="4"/>
    <circle cx="256" cy="256" r="30" fill="#0e1a2b" stroke="#06b6d4" stroke-width="6"/>
    <circle cx="256" cy="256" r="12" fill="#22c55e"/>
    <circle cx="400" cy="220" r="15" fill="#3b82f6" stroke="#0a0e17" stroke-width="4"/>
    <circle cx="188" cy="300" r="10" fill="#8b5cf6" stroke="#0a0e17" stroke-width="3"/>
    <circle cx="324" cy="300" r="10" fill="#f59e0b" stroke="#0a0e17" stroke-width="3"/>
  </g>
</svg>
