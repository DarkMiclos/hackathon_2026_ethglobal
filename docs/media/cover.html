<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NameFlow cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0e17; font-family: Inter, system-ui, sans-serif; color: #e2e8f0; }
  .stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(1200px 500px at 20% 110%, rgba(59,130,246,0.18), transparent 60%),
                radial-gradient(900px 400px at 95% -10%, rgba(139,92,246,0.18), transparent 60%), #0a0e17; }
  svg.waves { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,184,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.06) 1px, transparent 1px); background-size: 40px 40px; }
  .content { position: absolute; left: 80px; top: 120px; width: 700px; }
  .logo { display: flex; align-items: center; gap: 22px; }
  .logo img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(6,182,212,0.25); }
  .wordmark { font-size: 84px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
  .wordmark .a { color: #3b82f6; } .wordmark .b { color: #ffffff; }
  .tag { margin-top: 26px; font-size: 30px; font-weight: 500; color: #cbd5e1; line-height: 1.3; }
  .tag b { color: #fff; font-weight: 700; }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid #334155; background: rgba(17,24,39,0.8); color: #94a3b8; }
  .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .foot { position: absolute; left: 80px; bottom: 44px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #64748b; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <svg class="waves" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
      <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
      <filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g fill="none" stroke-linecap="round" filter="url(#gl)">
      <path d="M700 470 C 820 380, 900 560, 1010 470 S 1180 380, 1300 470" stroke="url(#g3)" stroke-width="18" opacity="0.5"/>
      <path d="M660 400 C 800 280, 880 520, 1010 400 S 1200 280, 1320 400" stroke="url(#g1)" stroke-width="30"/>
      <path d="M720 330 C 830 240, 900 420, 1010 330 S 1180 240, 1300 330" stroke="url(#g2)" stroke-width="18" opacity="0.5"/>
      <path d="M-100 600 C 100 520, 250 660, 450 590 S 800 520, 1000 600" stroke="url(#g1)" stroke-width="10" opacity="0.25"/>
    </g>
    <g>
      <circle cx="1010" cy="400" r="40" fill="#0e1a2b" stroke="#06b6d4" stroke-width="7"/>
      <circle cx="1010" cy="400" r="16" fill="#22c55e"/>
      <circle cx="800" cy="330" r="18" fill="#3b82f6" stroke="#0a0e17" stroke-width="5"/>
      <circle cx="1130" cy="330" r="18" fill="#3b82f6" stroke="#0a0e17" stroke-width="5"/>
      <circle cx="880" cy="480" r="13" fill="#8b5cf6" stroke="#0a0e17" stroke-width="4"/>
      <circle cx="1140" cy="480" r="13" fill="#f59e0b" stroke="#0a0e17" stroke-width="4"/>
      <text x="800" y="298" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#94a3b8">sub-1.bob.nameflow.eth</text>
      <text x="1010" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#e2e8f0">WETH / USDC</text>
      <text x="1185" y="298" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="15" fill="#94a3b8">main.bob.nameflow.eth</text>
    </g>
  </svg>
  <div class="content">
    <div class="logo">
      <img src="logo.svg" alt="" />
      <div class="wordmark"><span class="a">Name</span><span class="b">Flow</span></div>
    </div>
    <div class="tag">A fun, flowy, wavy view of <b>Uniswap V3</b> swaps, named by <b>ENS</b>, indexed by <b>MultiBaas</b>.</div>
    <div class="chips">
      <span class="chip"><i style="background:#22c55e"></i>live swap tape</span>
      <span class="chip"><i style="background:#3b82f6"></i>trader × pool network</span>
      <span class="chip"><i style="background:#8b5cf6"></i>ENSv2 watchlist</span>
    </div>
  </div>
  <div class="foot">ETHGLOBAL TOKYO 2026 · SEPOLIA · VUE 3 + D3</div>
</div>
</body>
</html>
